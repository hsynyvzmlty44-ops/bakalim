<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boya bakalım</title>
<style>
:root{--bg:#eef0f6;--panel:#fff;--ink:#1f2433;--mute:#8b92a8;--line:#d5d9e6;--acc:#e8862a;--cv:#fbfbfd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--panel:#1c202b;--ink:#eceff7;--mute:#7c849c;--line:#2c3242;--acc:#f0a04b;--cv:#181b24}}
:root[data-theme="dark"]{--bg:#12151d;--panel:#1c202b;--ink:#eceff7;--mute:#7c849c;--line:#2c3242;--acc:#f0a04b;--cv:#181b24}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;gap:10px;padding:10px 14px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;flex:none}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
#pct{font-size:13px;font-variant-numeric:tabular-nums;color:var(--mute);min-width:36px;text-align:right}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#stage{flex:1;position:relative;margin:0 10px;border-radius:12px;overflow:hidden;background:var(--cv);border:1px solid var(--line);min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#pal{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 12px;scrollbar-width:none}
.sw{flex:none;width:54px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
.sw b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;border:1px solid rgba(0,0,0,.25)}
.sw small{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.sw.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.sw.fin{opacity:.45}
#tools{display:flex;gap:8px;padding:0 14px 0;justify-content:flex-end}
#end{position:absolute;inset:0;display:none;place-items:center;text-align:center;background:rgba(18,21,29,.72);color:#fff;padding:24px}
#end.show{display:grid}
#end h2{font-size:26px;margin:0 0 8px}
#end p{margin:0 0 16px;font-size:16px;line-height:1.4}
#rv,#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}
#shade{position:absolute;inset:0;background:rgba(10,12,20,0);transition:background 3s;pointer-events:none}
#card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.95);width:min(86%,440px);box-sizing:border-box;padding:24px 22px 18px;border-radius:18px;background:rgba(255,255,255,.95);color:#1f2433;text-align:center;border:2px dashed #e8862a;opacity:0;transition:opacity 1.6s,transform 1.6s;display:none}
#card.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#card h2{margin:0 0 12px;font-size:27px}
#card p{margin:0;font-size:19px;line-height:1.45}
#card small{display:block;margin-top:14px;color:#8b92a8;font-size:12px}
#card button{margin-top:14px;display:none;color:#1f2433;background:#fff}
</style></head>
<body>
<header><h1>Boya bakalım 🎨</h1><div class="bar"><i id="fill"></i></div><span id="pct">0%</span></header>
<div id="stage"><canvas id="cv"></canvas>
<canvas id="rv"></canvas><div id="shade"></div><canvas id="fx"></canvas>
<div id="card"><h2>Tebrikler! 🎉</h2><p id="msg"></p><small>Geçerlilik: süresiz 💕</small><button id="close">Kapat</button></div></div>
<div id="tools"><button id="mode">✋ Kaydır</button><button id="gift" hidden>🎁 Sürpriz</button><button id="fit">Sığdır</button><button id="reset">Sıfırla</button></div>
<div id="pal"></div>

const lab=Uint8Array.from(DATA,c=>c.charCodeAt(0)-65),N=W*H,K=PAL.length;
const done=new Uint8Array(N),rem=new Array(K).fill(0);
try{const s=localStorage.getItem(KEY);if(s&&s.length===N)for(let i=0;i<N;i++)done[i]=s[i]==="1"?1:0}catch(e){}
for(let i=0;i<N;i++)if(!done[i])rem[lab[i]]++;
let sel=0,total=N-rem.reduce((a,b)=>a+b,0),panMode=false;
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");
let cw=0,ch=0,z=10,ox=0,oy=0,raf=0,flash=-1;
const lum=h=>{const n=parseInt(h.slice(1),16);return .299*(n>>16)+.587*((n>>8)&255)+.114*(n&255)};
function fit(){z=Math.min(cw/W,ch/H);ox=(cw-W*z)/2;oy=(ch-H*z)/2;draw()}
function clamp(){const mz=Math.min(cw/W,ch/H);z=Math.max(mz,Math.min(z,mz*7));
 ox=W*z<=cw?(cw-W*z)/2:Math.min(0,Math.max(cw-W*z,ox));oy=H*z<=ch?(ch-H*z)/2:Math.min(0,Math.max(ch-H*z,oy))}
function size(){const r=stage.getBoundingClientRect(),d=devicePixelRatio||1;cw=r.width;ch=r.height;cv.width=cw*d;cv.height=ch*d;fit()}
function draw(){raf=0;clamp();const d=devicePixelRatio||1,cs=getComputedStyle(document.documentElement);
 const ink=cs.getPropertyValue("--ink"),mute=cs.getPropertyValue("--mute"),line=cs.getPropertyValue("--line"),acc=cs.getPropertyValue("--acc");
 ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,cw,ch);
 const c0=Math.max(0,Math.floor(-ox/z)),c1=Math.min(W-1,Math.floor((cw-ox)/z)),r0=Math.max(0,Math.floor(-oy/z)),r1=Math.min(H-1,Math.floor((ch-oy)/z));
 const num=z>=11;ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`${Math.floor(z*.5)}px system-ui,sans-serif`;
 for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const i=r*W+c,l=lab[i],x=ox+c*z,y=oy+r*z;
  if(done[i]){ctx.fillStyle=PAL[l];ctx.fillRect(x,y,z+.6,z+.6);continue}
  if(l===sel){ctx.fillStyle=PAL[l]+"77";ctx.fillRect(x,y,z,z);ctx.strokeStyle=acc;ctx.lineWidth=1.5;ctx.strokeRect(x+1,y+1,z-2,z-2)}
  if(num){ctx.fillStyle=l===sel?ink:mute;ctx.fillText(l+1,x+z/2,y+z/2+.5)}}
 if(num){ctx.strokeStyle=line;ctx.lineWidth=1;ctx.beginPath();
  for(let c=c0;c<=c1+1;c++){const x=Math.round(ox+c*z)+.5;ctx.moveTo(x,oy+r0*z);ctx.lineTo(x,oy+(r1+1)*z)}
  for(let r=r0;r<=r1+1;r++){const y=Math.round(oy+r*z)+.5;ctx.moveTo(ox+c0*z,y);ctx.lineTo(ox+(c1+1)*z,y)}ctx.stroke()}
 if(flash>=0){const c=flash%W,r=(flash/W)|0;ctx.strokeStyle="#e5484d";ctx.lineWidth=2.5;ctx.strokeRect(ox+c*z+1,oy+r*z+1,z-2,z-2)}}
const sched=()=>{if(!raf)raf=requestAnimationFrame(draw)};
// palette
const pal=document.getElementById("pal"),btns=[];
PAL.forEach((h,k)=>{const b=document.createElement("button");b.className="sw";b.setAttribute("aria-label","Renk "+(k+1));
 b.innerHTML=`<b style="background:${h};color:${lum(h)>140?"#111":"#fff"}">${k+1}</b><small></small>`;
 b.onclick=()=>select(k);pal.appendChild(b);btns.push(b)});
function upd(k){const b=btns[k];b.querySelector("small").textContent=rem[k]?rem[k]:"✓";b.classList.toggle("fin",rem[k]===0)}
function select(k){sel=k;btns.forEach((b,i)=>b.classList.toggle("sel",i===k));btns[k].scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});sched()}
for(let k=0;k<K;k++)upd(k);
function prog(){const p=Math.floor(total/N*100);document.getElementById("fill").style.width=(total/N*100)+"%";document.getElementById("pct").textContent=p+"%"}
let st=0;function save(){clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem(KEY,Array.from(done).join(""))}catch(e){}},400)}
function nextColor(){for(let s=1;s<=K;s++){const k=(sel+s)%K;if(rem[k]>0)return k}return -1}
function paintAt(px,py){const c=Math.floor((px-ox)/z),r=Math.floor((py-oy)/z);if(c<0||r<0||c>=W||r>=H)return;const i=r*W+c;if(done[i])return;
 if(lab[i]===sel){done[i]=1;rem[sel]--;total++;upd(sel);prog();save();
  if(rem[sel]===0){const n=nextColor();if(n>=0)select(n);else setTimeout(startEnding,500)}sched()}
 else{flash=i;sched();setTimeout(()=>{if(flash===i){flash=-1;sched()}},220)}}
// gestures
const P=new Map();let painting=false,g=null,last=null;
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
function gStart(){const [a,b]=[...P.values()];g={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,z,ox,oy}}
cv.addEventListener("pointerdown",e=>{if(ending)return;cv.setPointerCapture(e.pointerId);const p=pos(e);P.set(e.pointerId,p);
 if(P.size===1){last=p;painting=!panMode;if(painting)paintAt(p.x,p.y)}else{painting=false;gStart()}});
cv.addEventListener("pointermove",e=>{if(!P.has(e.pointerId))return;const p=pos(e);P.set(e.pointerId,p);
 if(P.size>=2){const [a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  z=g.z*d/g.d;const wx=(g.mx-g.ox)/g.z,wy=(g.my-g.oy)/g.z;ox=mx-wx*z;oy=my-wy*z;sched()}
 else if(painting)paintAt(p.x,p.y);
 else if(panMode&&last){ox+=p.x-last.x;oy+=p.y-last.y;last=p;sched()}});
const up=e=>{P.delete(e.pointerId);painting=false;g=null;const r=[...P.values()];last=r[0]||null;if(r.length===1&&!panMode)painting=false};
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",e=>{e.preventDefault();if(ending)return;const p=pos(e),f=Math.exp(-e.deltaY*.0015),nz=z*f;ox=p.x-(p.x-ox)*(nz/z);oy=p.y-(p.y-oy)*(nz/z);z=nz;sched()},{passive:false});
// buttons
const modeB=document.getElementById("mode");
modeB.onclick=()=>{panMode=!panMode;modeB.classList.toggle("on",panMode);modeB.textContent=panMode?"🖌 Boya":"✋ Kaydır"};
document.getElementById("fit").onclick=fit;
const rb=document.getElementById("reset");let rt=0;
rb.onclick=()=>{if(!rt){rb.textContent="Emin misin?";rt=setTimeout(()=>{rt=0;rb.textContent="Sıfırla"},3000);return}
 clearTimeout(rt);rt=0;rb.textContent="Sıfırla";done.fill(0);document.getElementById("gift").hidden=true;rem.fill(0);for(let i=0;i<N;i++)rem[lab[i]]++;total=0;
 for(let k=0;k<K;k++)upd(k);prog();save();select(0);fit()};
new ResizeObserver(size).observe(stage);

const rv=document.getElementById("rv"),rctx=rv.getContext("2d"),fx=document.getElementById("fx"),fctx=fx.getContext("2d");
const card=document.getElementById("card"),shade=document.getElementById("shade"),msg=document.getElementById("msg"),closeB=document.getElementById("close"),giftB=document.getElementById("gift");
const MSG="Sevgilinizle birlikte geçirebileceğiniz, dilediğiniz bir gün kazandınız.",calm=matchMedia("(prefers-reduced-motion: reduce)").matches,HE=["❤️","💖","💕","💗"];
let ending=false,parts=[],fxOn=false,lastR=0;
function startEnding(){if(ending)return;ending=true;if(total===N)giftB.hidden=false;P.clear();painting=false;msg.innerHTML="";fit();
 const d=devicePixelRatio||1;[rv,fx].forEach(c=>{c.width=cw*d;c.height=ch*d;c.style.display="block"});rctx.setTransform(d,0,0,d,0,0);fctx.setTransform(d,0,0,d,0,0);
 const off=document.createElement("canvas"),octx=off.getContext("2d"),DUR=calm?1500:11000;
 const run=()=>{const t0=performance.now();const r=now=>{if(!ending)return;const t=Math.min(1,(now-t0)/DUR),n=Math.round(W*Math.pow(IMG.naturalWidth/W,Math.pow(t,.75))),m=Math.round(n*H/W);
  off.width=n;off.height=m;octx.drawImage(IMG,0,0,n,m);rctx.clearRect(0,0,cw,ch);rctx.imageSmoothingEnabled=t>=1;rctx.globalAlpha=Math.min(1,t*8);rctx.drawImage(off,ox,oy,W*z,H*z);
  if(t<1)requestAnimationFrame(r);else finale()};requestAnimationFrame(r)};
 IMG.complete&&IMG.naturalWidth?run():IMG.onload=run}
function finale(){shade.style.background="rgba(10,12,20,.5)";fxOn=!calm;lastR=0;if(fxOn)requestAnimationFrame(loop);
 card.style.display="block";setTimeout(()=>card.classList.add("show"),1200);setTimeout(()=>type(0),3000)}
function type(i){if(!ending)return;msg.innerHTML=MSG.slice(0,i)+'<span style="visibility:hidden">'+MSG.slice(i)+"</span>";
 if(i<MSG.length)setTimeout(()=>type(i+1),60);else closeB.style.display="inline-block"}
function loop(now){if(!fxOn)return;fctx.clearRect(0,0,cw,ch);
 if(now-lastR>700){lastR=now;parts.push({k:"r",x:cw*(.15+Math.random()*.7),y:ch,vx:(Math.random()-.5),vy:-Math.sqrt(.24*ch*(.45+Math.random()*.3)),h:Math.random()*360,life:1})}
 if(Math.random()<.05)parts.push({k:"h",x:Math.random()*cw,y:ch+20,vy:-(.7+Math.random()*1.3),s:16+Math.random()*22,e:HE[(Math.random()*4)|0],ph:Math.random()*6,life:1});
 for(const p of parts){
  if(p.k==="r"){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;fctx.fillStyle=`hsl(${p.h},100%,70%)`;fctx.fillRect(p.x,p.y,3,3);
   if(p.vy>-1){p.life=0;for(let i=0;i<70;i++){const a=Math.PI*2*i/70,s=1.5+Math.random()*3.2;parts.push({k:"s",x:p.x,y:p.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,h:p.h+Math.random()*40,life:1})}}}
  else if(p.k==="s"){p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.vx*=.985;p.life-=.012;fctx.globalAlpha=Math.max(0,p.life);fctx.fillStyle=`hsl(${p.h},100%,65%)`;fctx.fillRect(p.x,p.y,2.5,2.5);fctx.globalAlpha=1}
  else{p.y+=p.vy;p.x+=Math.sin(p.ph+=.03)*.6;p.life=p.y>-40?1:0;fctx.font=p.s+"px serif";fctx.fillText(p.e,p.x,p.y)}}
 parts=parts.filter(p=>p.life>0);requestAnimationFrame(loop)}
closeB.onclick=()=>{ending=false;fxOn=false;parts=[];[rv,fx].forEach(c=>c.style.display="none");card.classList.remove("show");card.style.display="none";shade.style.background="rgba(10,12,20,0)";closeB.style.display="none";msg.innerHTML=""};
giftB.onclick=startEnding;
let tc=0,tt=0;document.querySelector("h1").onclick=()=>{const n=Date.now();tc=n-tt<800?tc+1:1;tt=n;if(tc>=5){tc=0;startEnding()}};
</script></body></html>
